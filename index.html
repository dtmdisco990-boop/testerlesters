<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#0b0a14;color:#fff;font:20px sans-serif">This game needs JavaScript enabled.</div></noscript>

<!-- Boot guard: runs first. Guarantees there is never an infinite spinner. -->
<script>
(function () {
  var failed = false;
  window.__booted = false;
  function $(id) { return document.getElementById(id); }
  function fit() {
    var st = $('stage'); if (!st) return;
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();
  window.__bootProgress = function (p, note) {
    var f = $('boot-fill'); if (f) f.style.width = Math.round(p * 100) + '%';
    if (note && $('boot-note')) $('boot-note').textContent = note;
  };
  window.__bootFail = function (msg) {
    if (window.__booted || failed) return;
    failed = true;
    $('boot-loading').hidden = true;
    $('boot-error').hidden = false;
    $('boot-error-msg').textContent = String(msg || 'Unknown error');
    $('boot').style.display = 'flex';
  };
  window.__bootDone = function () {
    if (failed) return; // a failed script load must never be hidden by a later 'success'
    window.__booted = true;
    var b = $('boot'); if (b) { b.classList.add('done'); setTimeout(function () { b.style.display = 'none'; }, 400); }
  };
  window.addEventListener('error', function (ev) {
    if (!window.__booted) {
      var t = ev.target;
      if (t && t.tagName === 'SCRIPT') window.__bootFail('Could not load ' + (t.getAttribute('src') || 'a script file') + '. Check that all files were uploaded.');
      else window.__bootFail('Script error: ' + (ev.message || 'unknown') + (ev.filename ? ' (' + ev.filename.split('/').pop() + ':' + ev.lineno + ')' : ''));
    }
  }, true);
  window.addEventListener('unhandledrejection', function (ev) { if (!window.__booted) window.__bootFail('Unhandled error: ' + (ev.reason && ev.reason.message || ev.reason)); });
  setTimeout(function () { if (!window.__booted) window.__bootFail('Loading timed out after 15 seconds.'); }, 15000);
  document.addEventListener('DOMContentLoaded', function () {
    $('boot-retry').onclick = function () { location.reload(); };
    $('boot-reset').onclick = function () {
      if (!window.confirm('Reset your save data? A backup copy is kept in browser storage.')) return;
      try {
        var keys = []; for (var i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
        keys.forEach(function (k) {
          if (k && k.indexOf('jjk_td_save') === 0 && k.indexOf('_backup') < 0 && k.indexOf('_reset_backup') < 0) {
            if (k === 'jjk_td_save') { try { localStorage.setItem('jjk_td_save_reset_backup', localStorage.getItem(k)); } catch (e) {} }
            localStorage.removeItem(k);
          }
        });
      } catch (e) {}
      location.reload();
    };
  });
})();
</script>
